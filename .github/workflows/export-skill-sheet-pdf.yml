name: Export skill sheet PDF

on:
  push:
    branches-ignore:
      - master
    paths:
      - 'README.md'
      - 'excel/skill-sheet.xlsx'
      - 'excel/templates/**'
      - 'scripts/export_skill_sheet.py'
      - 'scripts/export_skill_sheet_pdf.sh'
      - 'scripts/render_skill_sheet_pdf.py'
      - 'requirements.txt'
      - '.github/workflows/export-skill-sheet-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-skill-sheet-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.ref_type == 'branch' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-noto-cjk fonts-ipafont-gothic poppler-utils
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Excel opens and saves with merged cells intact
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/roundtrip"
          libreoffice "-env:UserInstallation=file://$temp_dir/lo-profile" \
            --headless --convert-to 'xlsx:Calc MS Excel 2007 XML' \
            --outdir "$temp_dir/roundtrip" excel/skill-sheet.xlsx
          python3 - "$temp_dir/roundtrip/skill-sheet.xlsx" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile

          def merged_ranges(path):
              with ZipFile(path) as archive:
                  assert archive.testzip() is None, 'Invalid XLSX archive'
                  root = ET.fromstring(archive.read('xl/worksheets/sheet1.xml'))
              ns = {'x': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              return {cell.attrib['ref'] for cell in root.findall('x:mergeCells/x:mergeCell', ns)}

          expected = merged_ranges('excel/skill-sheet.xlsx')
          assert {'B2:S2', 'D3:F3', 'D8:S8', 'B12:E13'} <= expected, 'Missing required merged cells'
          actual = merged_ranges(sys.argv[1])
          assert actual == expected, 'Merged cells changed after opening and saving'
          print(f'Excel round-trip successful: {len(actual)} merged ranges preserved')
          PY
      - name: Generate PDF
        run: bash scripts/export_skill_sheet_pdf.sh
      - name: Verify PDF
        run: |
          test -s docs/skill-sheet.pdf
          pdfinfo docs/skill-sheet.pdf | grep -E '^Pages:|^Page size:'
          python -m unittest discover -s tests -p 'test_skill_sheet_pdf.py' -v
      - name: Commit generated PDF
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/skill-sheet.pdf
          if git diff --cached --quiet; then
            echo 'PDF is already up to date'
            exit 0
          fi
          git commit -m '縦向きのPDFスキルシートを更新'
          git push origin "HEAD:${TARGET_BRANCH}"
