name: Export skill sheet PDF

on:
  push:
    branches-ignore:
      - master
    paths:
      - 'excel/skill-sheet.xlsx'
      - 'scripts/export_skill_sheet_pdf.sh'
      - '.github/workflows/export-skill-sheet-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-skill-sheet-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.ref_type == 'branch' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-noto-cjk poppler-utils
      - name: Generate PDF
        run: bash scripts/export_skill_sheet_pdf.sh
      - name: Verify PDF
        run: |
          test -s docs/skill-sheet.pdf
          pdfinfo docs/skill-sheet.pdf | grep -E '^Pages:|^Page size:'
          if ! pdfinfo docs/skill-sheet.pdf | grep -q 'A3'; then
            echo 'PDF must retain A3 page size' >&2
            exit 1
          fi
      - name: Commit generated PDF
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/skill-sheet.pdf
          if git diff --cached --quiet; then
            echo 'PDF is already up to date'
            exit 0
          fi
          git commit -m 'Excelに対応するPDFスキルシートを更新'
          git push origin "HEAD:${TARGET_BRANCH}"
