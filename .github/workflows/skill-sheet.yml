name: Skill sheet

on:
  pull_request:
    branches: [master]
    paths:
      - README.md
      - excel/**
      - scripts/export_skill_sheet.py
      - tests/**
      - requirements.txt
      - .github/workflows/skill-sheet.yml
  push:
    branches: [master]
    paths:
      - README.md
      - excel/**
      - scripts/export_skill_sheet.py
      - tests/**
      - requirements.txt
      - .github/workflows/skill-sheet.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Excel generation
        run: python -m unittest discover -s tests -v
      - name: Check Markdown and Excel are in sync
        run: python scripts/export_skill_sheet.py --check
